name: Mirror Dentiva Windows Application

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mirror-source:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror source repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/kshohanservice-glitch/Dentiva-Windows-Application.git /tmp/source
          rsync -a --delete --exclude='.git' /tmp/source/ ./
          git add -A
          if git diff --cached --quiet; then
            echo "Already mirrored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: mirror Dentiva-Windows-Application [skip ci]"
          git push origin HEAD:main
